---
layout: default
---

<style>
  .category-title { font-size: 1.5rem; margin-bottom: 20px; color: #212529; }
  .post-card {
    background: #ffffff; padding: 24px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e9ecef;
  }
  .post-card h3 a { text-decoration: none; color: #212529; font-size: 1.4rem; }
  .post-card h3 a:hover { color: #007bff; }
  .post-card p { color: #495057; margin: 10px 0 12px 0; }
  .post-card .post-meta { font-size: 0.85rem; color: #868e96; display: flex; align-items: center; gap: 10px; }
  .post-card .badge { background-color: #e9ecef; color: #495057; padding: 2px 8px; border-radius: 4px; }
</style>

<h2 class="category-title" id="pageCategoryTitle">전체글</h2>
<div id="postListContainer"></div>

<script>
  // 1. Jekyll에서 모든 포스트 정보를 JSON으로 파싱하여 JS 배열 생성
  const allPosts = [
    {% for post in site.posts %}
      {
        title: {{ post.title | jsonify }},
        url: "{{ post.url | relative_url }}",
        date: "{{ post.date | date: '%Y-%m-%d' }}",
        summary: {{ post.summary | default: post.excerpt | strip_html | truncatewords: 25 | jsonify }},
        categories: {{ post.categories | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  // 2. URL 쿼리 파라미터에서 선택된 카테고리 추출
  const urlParams = new URLSearchParams(window.location.search);
  const selectedCategory = urlParams.get('category');

  const titleEl = document.getElementById('pageCategoryTitle');
  const containerEl = document.getElementById('postListContainer');

  // 3. 필터링 및 렌더링 함수
  let filteredPosts = allPosts;

  if (selectedCategory) {
    titleEl.innerText = selectedCategory;
    filteredPosts = allPosts.filter(post => post.categories.includes(selectedCategory));
    
    // 카테고리가 8월~2월 중 하나라면 사이드바 드롭아웃 메뉴를 자동으로 열어둠
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdownBtn = document.getElementById('dropdownBtn');
    if (dropdownMenu && dropdownBtn) {
      dropdownMenu.classList.add('show');
      dropdownBtn.classList.add('open');
    }
  } else {
    titleEl.innerText = '전체글';
  }

  // 4. 화면 출력
  if (filteredPosts.length === 0) {
    containerEl.innerHTML = '<p style="color: #868e96; padding: 20px 0;">해당 카테고리에 작성된 글이 없습니다.</p>';
  } else {
    containerEl.innerHTML = filteredPosts.map(post => `
      <article class="post-card">
        <h3><a href="${post.url}">${post.title}</a></h3>
        <p>${post.summary}</p>
        <div class="post-meta">
          <span>${post.date}</span>
          ${post.categories.map(cat => `<span class="badge">${cat}</span>`).join(' ')}
        </div>
      </article>
    `).join('');
  }
</script>
