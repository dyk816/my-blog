<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "Dongyoon's Dev Blog" }}</title>
  <style>
    /* 기본 스타일 리셋 및 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f8f9fa;
    }

    /* 1. 상단 고정 헤더 바 (스크롤 시 활성화) */
    .sticky-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      z-index: 1000;
      
      opacity: 0;
      transform: translateY(-100%);
      transition: all 0.3s ease-in-out;
    }

    .sticky-header.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* 상단 바 타이틀 클릭 버튼 */
    .sticky-header .title-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      color: #212529;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    .sticky-header .title-btn:hover {
      color: #007bff;
    }

    /* 2. 블로그 타이틀 영역 (정중앙 정렬) */
    .blog-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 20px 40px 20px;
      text-align: center;
      background-color: #ffffff;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .blog-header h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: #111;
    }
    .blog-header blockquote {
      font-size: 1.1rem;
      color: #6c757d;
      font-style: italic;
      margin: 0;
    }
    .blog-header blockquote::before { content: "“"; }
    .blog-header blockquote::after { content: "”"; }

    /* 3. 메인 컨텐츠 레이아웃 (좌 3/4, 우 1/4) */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      gap: 30px;
    }

    /* 좌측 3/4: 메인 본문/글 목록 영역 */
    .main-content {
      flex: 3; /* 75% 비율 */
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      min-height: 400px;
    }

    /* 마크다운 본문 스타일링 기본 지정 */
    .main-content h1, .main-content h2, .main-content h3 {
      margin-top: 24px;
      margin-bottom: 12px;
      color: #212529;
    }
    .main-content p {
      margin-bottom: 16px;
      color: #495057;
    }
    .main-content pre {
      background: #282c34;
      color: #abb2bf;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 16px;
    }
    .main-content code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .main-content pre code {
      background: none;
      padding: 0;
    }

    /* 우측 1/4: 카테고리 사이드바 */
    .sidebar {
      flex: 1; /* 25% 비율 */
      height: fit-content;
      position: sticky;
      top: 80px;
    }
    .category-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    .category-box h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #212529;
    }
    .category-list, .sub-category-list, .sub-sub-category-list {
      list-style: none;
    }
    .category-list li {
      margin-bottom: 8px;
    }
    .category-list a {
      text-decoration: none;
      color: #495057;
      display: block;
      padding: 4px 0;
      transition: color 0.2s;
    }
    .category-list a:hover {
      color: #007bff;
      font-weight: bold;
    }
    .sub-category-list { padding-left: 15px; }
    .sub-sub-category-list { padding-left: 15px; }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }
      .blog-header h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- 스크롤 시 나타나는 상단 고정 바 -->
  <header class="sticky-header" id="stickyHeader">
    <button class="title-btn" onclick="scrollToTop()">Dongyoon's Dev Blog</button>
  </header>

  <!-- 메인 타이틀 및 부제 (중앙 정렬) -->
  <section class="blog-header" id="mainHeader">
    <h1>Dongyoon's Dev Blog</h1>
    <blockquote>닿을 수 없는 별을 향해</blockquote>
  </section>

  <!-- 메인 컨텐츠 영역 (좌측 3/4 + 우측 1/4) -->
  <div class="container">
    
    <!-- 좌측 3/4: 마크다운 파일 내용이 렌더링될 위치 -->
    <main class="main-content">
      {{ content }}
    </main>

    <!-- 우측 1/4: 카테고리 -->
    <aside class="sidebar">
      <div class="category-box">
        <h3>Category</h3>
        <ul class="category-list">
          <li>
            <a href="/">전체글</a>
            <ul class="sub-category-list">
              <li>
                <a href="#">2026 원티드랩 부트캠프</a>
                <ul class="sub-sub-category-list">
                  <li><a href="#">- 8월</a></li>
                  <li><a href="#">- 9월</a></li>
                  <li><a href="#">- 10월</a></li>
                  <li><a href="#">- 11월</a></li>
                  <li><a href="#">- 12월</a></li>
                  <li><a href="#">- 1월</a></li>
                  <li><a href="#">- 2월</a></li>
                </ul>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </aside>

  </div>

  <script>
    // 상단 고정 바 클릭 시 최상단 스크롤 이동
    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    // 스크롤 감지 (IntersectionObserver)
    const mainHeader = document.getElementById('mainHeader');
    const stickyHeader = document.getElementById('stickyHeader');

    const observer = new IntersectionObserver(
      ([entry]) => {
        if (!entry.isIntersecting) {
          stickyHeader.classList.add('active');
        } else {
          stickyHeader.classList.remove('active');
        }
      },
      { root: null, threshold: 0 }
    );

    observer.observe(mainHeader);
  </script>
</body>
</html>
