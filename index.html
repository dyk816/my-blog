---
layout: null
---
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부트캠프 일기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Gulim', '굴림', 'Comic Sans MS', sans-serif;
      background: linear-gradient(
        to bottom,
        #ff0000 0%, #ff0000 14.28%,
        #ff7f00 14.28%, #ff7f00 28.56%,
        #ffff00 28.56%, #ffff00 42.84%,
        #00ff00 42.84%, #00ff00 57.12%,
        #00ffff 57.12%, #00ffff 71.4%,
        #0000ff 71.4%, #0000ff 85.68%,
        #8b00ff 85.68%, #8b00ff 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
    }

    .title-box {
      background-color: #fffb8f;
      border: 8px solid #0000ff;
      box-shadow: 10px 10px 0px #ff00ff;
      padding: 20px 50px;
      text-align: center;
      margin-bottom: 40px;
      animation: bounce 1.5s infinite alternate;
    }

    .title-box h1 {
      font-size: 3.2rem;
      color: #ff0000;
      text-shadow: 3px 3px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
      letter-spacing: 5px;
    }

    .main-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .bubble-wrapper {
      flex: 1;
      min-width: 260px;
      display: flex;
      justify-content: center;
    }

    .shout-bubble {
      width: 250px;
      height: 250px;
      background: #ffeb3b;
      clip-path: polygon(
        50% 0%, 63% 18%, 82% 10%, 78% 30%, 98% 35%, 
        85% 50%, 100% 70%, 78% 75%, 80% 95%, 
        60% 85%, 50% 100%, 40% 85%, 20% 95%, 
        22% 75%, 0% 70%, 15% 50%, 2% 35%, 
        22% 30%, 18% 10%, 37% 18%
      );
      display: flex;
      justify-content: center;
      align-items: center;
      filter: drop-shadow(5px 5px 0px #000000);
      transform: rotate(-10deg);
      transition: transform 0.2s;
    }

    .shout-bubble:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .shout-bubble span {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 2px 2px 0px #ffffff, -2px -2px 0px #ffffff, 2px -2px 0px #ffffff, -2px 2px 0px #ffffff;
    }

    .post-list-box {
      flex: 1.2;
      min-width: 300px;
      background: rgba(255, 255, 255, 0.9);
      border: 5px dashed #ff0080;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .post-list-box h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #008000;
      font-size: 1.6rem;
    }

    .post-list {
      list-style-type: '👉 ';
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .post-list li a {
      color: #0000cc;
      font-weight: bold;
      text-decoration: underline;
      font-size: 1.1rem;
    }

    .post-list li a:hover {
      color: #ff0000;
      background-color: yellow;
    }

    .bonobono-wrapper {
      flex: 1;
      min-width: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bono-head {
      width: 200px;
      height: 190px;
      background-color: #5bc4f5;
      border: 4px solid #000;
      border-radius: 50% 50% 45% 45%;
      position: relative;
    }

    .bono-eye {
      width: 8px;
      height: 12px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 75px;
    }
    .bono-eye.left { left: 40px; }
    .bono-eye.right { right: 40px; }

    .bono-muzzle-wrap {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 70px;
    }

    .bono-nose {
      width: 24px;
      height: 28px;
      background-color: #000;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    .bono-mouth {
      width: 32px;
      height: 40px;
      background-color: #d13030;
      border: 3px solid #000;
      border-radius: 50%;
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
    }

    .bono-cheek {
      width: 44px;
      height: 40px;
      background-color: #ffffff;
      border: 3px solid #000;
      border-radius: 50%;
      position: absolute;
      top: 10px;
      z-index: 2;
    }
    .bono-cheek.left { left: 4px; }
    .bono-cheek.right { right: 4px; }

    .bono-sweat {
      position: absolute;
      top: 25px;
      right: 25px;
      width: 20px;
      height: 25px;
      background-color: #ffffff;
      border: 2px solid #000;
      border-radius: 0% 100% 50% 50% / 0% 50% 50% 100%;
      transform: rotate(45deg);
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="title-box">
    <h1>부트캠프 일기</h1>
  </div>

  <div class="main-container">
    <div class="bubble-wrapper">
      <div class="shout-bubble">
        <span>즐겁다!</span>
      </div>
    </div>

    <div class="post-list-box">
      <h2>🔥 최근 일기 목록</h2>
      <ul class="post-list">
        {% for post in site.posts %}
          <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
        {% endfor %}
      </ul>
    </div>

    <div class="bonobono-wrapper">
      <div class="bono-head">
        <div class="bono-sweat"></div>
        <div class="bono-eye left"></div>
        <div class="bono-eye right"></div>
        <div class="bono-muzzle-wrap">
          <div class="bono-nose"></div>
          <div class="bono-cheek left"></div>
          <div class="bono-cheek right"></div>
          <div class="bono-mouth"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
